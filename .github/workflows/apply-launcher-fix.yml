name: Apply launcher fix

on:
  push:
    branches:
      - fix/launcher-stop-script
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launcher-stop-script

      - name: Patch generated stop script and strengthen self-test
        shell: pwsh
        run: |
          $path = 'Install-MiniMaxH3.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $oldProc = '    $proc = Get-Process -Id `$targetPid -ErrorAction SilentlyContinue'
          $newProc = '    `$proc = Get-Process -Id `$targetPid -ErrorAction SilentlyContinue'
          if (-not $text.Contains($oldProc)) { throw 'Expected unescaped $proc line was not found.' }
          $text = $text.Replace($oldProc, $newProc)

          $functionMarker = 'function Install-WorkflowAndLauncher {'
          $syntaxFunction = @'
          function Assert-PowerShellScriptSyntax {
              param([string]$Path)
              $tokens = $null
              $parseErrors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($Path, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  $details = ($parseErrors | ForEach-Object { "Line $($_.Extent.StartLineNumber): $($_.Message)" }) -join "; "
                  throw "Generated PowerShell script failed syntax validation: $Path. $details"
              }
          }

          '@
          if (-not $text.Contains($functionMarker)) { throw 'Workflow launcher function marker was not found.' }
          $text = $text.Replace($functionMarker, $syntaxFunction + $functionMarker)

          $writeMarker = '"@ | Set-Content -LiteralPath $stopPs1 -Encoding UTF8'
          $writeReplacement = @'
          "@ | Set-Content -LiteralPath $stopPs1 -Encoding UTF8

              Assert-PowerShellScriptSyntax $startPs1
              Assert-PowerShellScriptSyntax $stopPs1
          '@
          if (-not $text.Contains($writeMarker)) { throw 'Stop-script write marker was not found.' }
          $text = $text.Replace($writeMarker, $writeReplacement)

          Set-Content -LiteralPath $path -Value $text -Encoding UTF8

      - name: Parse installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Install-MiniMaxH3.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Install-MiniMaxH3.ps1
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Fix generated stop script and validate launcher syntax"
          git push origin HEAD:fix/launcher-stop-script
