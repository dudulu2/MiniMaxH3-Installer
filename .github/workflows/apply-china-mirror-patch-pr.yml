name: Apply China mirror patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/china-mirror-mode
      - name: Apply patch
        run: python tools/apply_china_mirror_patch.py
      - name: Validate syntax
        shell: pwsh
        run: |
          $paths = @('assets/hardware_profiles_core.ps1','assets/hardware_profiles_install.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          python -m py_compile assets/download_models.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_core.ps1 assets/hardware_profiles_install.ps1 assets/download_models.py README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add China mainland mirror priority mode"
          git push origin HEAD:feature/china-mirror-mode
