name: Patch clean installer download failover

on:
  push:
    branches: [plugin-minimaxh3-clean]
    paths:
      - '.github/workflows/patch-clean-download-failover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch download failover
        shell: powershell
        run: |
          $path = 'plugin-minimaxh3-clean\Install-Plugins.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $new = @'
          function Invoke-DownloadOne([string]$Url, [string]$Destination, [string]$WorkingDirectory) {
              Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
              $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
              if ($curl) {
                  # One URL gets one bounded attempt. The caller owns source failover.
                  # This avoids spending several minutes retrying a dead GitHub route.
                  $args = @("-L", "--fail", "--silent", "--show-error", "--connect-timeout", "12", "--max-time", "90", "-o", $Destination, $Url)
                  $code = Invoke-Native $curl.Source $args $WorkingDirectory -AllowFailure
                  if ($code -eq 0 -and (Test-Path -LiteralPath $Destination -PathType Leaf) -and (Get-Item -LiteralPath $Destination).Length -gt 0) {
                      return
                  }
                  Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
                  throw "curl download failed; switching source: $Url"
              }

              Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $Destination -TimeoutSec 90
              if (-not (Test-Path -LiteralPath $Destination -PathType Leaf) -or (Get-Item -LiteralPath $Destination).Length -le 0) {
                  throw "Downloaded file is empty: $Url"
              }
          }
          '@
          $new = ($new -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          $pattern = '(?s)function Invoke-DownloadOne.*?(?=\r?\nfunction Test-ZipFile)'
          if (-not [regex]::IsMatch($text, $pattern)) { throw 'Invoke-DownloadOne block not found.' }
          $text = [regex]::Replace($text, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $new.TrimEnd() })

          $newUrls = @'
              $urls = @(
                  "https://codeload.github.com/$($Spec.Repo)/zip/$($Spec.Commit)",
                  $githubUrl,
                  "https://ghfast.top/$githubUrl",
                  "https://gh-proxy.com/$githubUrl"
              )
          '@
          $newUrls = ($newUrls -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          $urlPattern = '(?s)(function Download-RepoArchive.*?\$githubUrl = [^\r\n]+\r?\n)\s*\$urls = @\(.*?\)\r?\n'
          if (-not [regex]::IsMatch($text, $urlPattern)) { throw 'Archive URL block not found.' }
          $text = [regex]::Replace($text, $urlPattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $m.Groups[1].Value + $newUrls + "`r`n" }, 1)

          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Commit patched installer
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin-minimaxh3-clean/Install-Plugins.ps1
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Fail over quickly across plugin download sources"
          git push origin HEAD:plugin-minimaxh3-clean
