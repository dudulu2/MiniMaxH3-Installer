name: Fetch MiniMax H3 inventory

on:
  push:
    branches:
      - feat/hardware-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hardware-profiles

      - name: Fetch official Hugging Face inventory
        run: |
          python - <<'PY'
          import json
          import requests
          from pathlib import Path

          url = "https://huggingface.co/api/models/Comfy-Org/MiniMax-H3/tree/main?recursive=true&expand=true"
          response = requests.get(url, timeout=60)
          response.raise_for_status()
          rows = response.json()
          wanted = []
          for row in rows:
              path = row.get("path", "")
              if not path.endswith(".safetensors"):
                  continue
              if not (path.startswith("diffusion_models/") or path.startswith("text_encoders/") or path.startswith("vae/")):
                  continue
              lfs = row.get("lfs") or {}
              wanted.append({
                  "path": path,
                  "size": row.get("size") or lfs.get("size"),
                  "sha256": lfs.get("oid"),
              })
          Path("assets/hf_model_inventory.json").write_text(
              json.dumps(sorted(wanted, key=lambda x: x["path"]), indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hf_model_inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record official MiniMax H3 model inventory"
          git push origin HEAD:feat/hardware-profiles
