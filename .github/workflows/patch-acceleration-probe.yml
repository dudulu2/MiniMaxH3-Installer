name: Patch acceleration distribution probe

on:
  push:
    branches: [plugin-minimaxh3-current]
    paths:
      - '.github/workflows/patch-acceleration-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace fragile missing-distribution probe
        shell: powershell
        run: |
          $path = 'plugin-minimaxh3/Install-Acceleration.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $old = @'
function Get-DistributionVersion([string]$Python, [string]$Distribution, [string]$Root) {
    $code = "import importlib.metadata as m; print(m.version('" + $Distribution.Replace("'", "") + "'))"
    Push-Location $Root
    try {
        $out = @(& $Python -c $code 2>$null)
        if ($LASTEXITCODE -ne 0) { return $null }
        return ([string]($out | Select-Object -Last 1)).Trim()
    } finally { Pop-Location }
}
'@
          $new = @'
function Get-DistributionVersion([string]$Python, [string]$Distribution, [string]$Root) {
    # Missing Triton/Sage is the normal first-install state. Avoid
    # importlib.metadata.version(), which raises PackageNotFoundError and can
    # become a terminating NativeCommandError under Windows PowerShell 5.1.
    $safeName = $Distribution.Replace("'", "")
    $code = "import importlib.metadata as m; n='" + $safeName + "'.lower().replace('_','-'); print(next((d.version for d in m.distributions() if ((d.metadata.get('Name') or '').lower().replace('_','-') == n)), ''))"
    Push-Location $Root
    $oldPreference = $ErrorActionPreference
    try {
        $ErrorActionPreference = "Continue"
        $out = @(& $Python -c $code 2>&1)
        $exitCode = [int]$LASTEXITCODE
    } finally {
        $ErrorActionPreference = $oldPreference
        Pop-Location
    }
    if ($exitCode -ne 0) {
        $details = (@($out | ForEach-Object { [string]$_ }) -join " | ").Trim()
        throw "Could not inspect installed distribution '$Distribution'. Python output: $details"
    }
    $value = ([string]($out | Select-Object -Last 1)).Trim()
    if ([string]::IsNullOrWhiteSpace($value)) { return $null }
    return $value
}
'@
          if (-not $text.Contains($old)) { throw 'Expected old Get-DistributionVersion block was not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

      - name: Parse patched PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'plugin-minimaxh3/Install-Acceleration.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Commit patch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin-minimaxh3/Install-Acceleration.ps1
          git commit -m "Handle missing acceleration distributions safely"
          git push origin HEAD:plugin-minimaxh3-current
