name: Validate regional download routing

on:
  push:
    branches:
      - main
      - fix/regional-download-routing-20260812
  pull_request:

permissions:
  contents: read

jobs:
  validate-regional-routing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($path in @('assets/download_route_fix.ps1', 'Start-Installer.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "Line $($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              throw "$path did not parse in Windows PowerShell 5.1: $detail"
            }
          }

      - name: Validate route override load order
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'Start-Installer.ps1' -Raw
          $torch = $text.IndexOf('local_torch_wheels.ps1')
          $route = $text.IndexOf('download_route_fix.ps1')
          if ($torch -lt 0 -or $route -lt 0 -or $route -le $torch) {
            throw 'Regional download routing must load after local_torch_wheels.ps1.'
          }

      - name: Validate mainland and overseas source policy
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/download_route_fix.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'download_route_fix.ps1 did not parse.' }
          $fn = $ast.Find({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Get-TorchWheelUrls' }, $true)
          Invoke-Expression $fn.Extent.Text
          $runtime = [PSCustomObject]@{
            index_url = 'https://download.pytorch.org/whl/cu130'
            mirror_index_url = 'https://mirrors.aliyun.com/pytorch-wheels/cu130'
          }

          function Test-ChinaMirrorPriority { return $true }
          $cn = @(Get-TorchWheelUrls $runtime 'torch.whl')
          if ($cn.Count -ne 2 -or $cn[0] -notmatch '^https://mirrors\.aliyun\.com/' -or $cn[1] -notmatch '^https://download\.pytorch\.org/') {
            throw "Mainland route is not mirror-first with official fallback: $($cn -join ', ')"
          }

          Remove-Item function:Test-ChinaMirrorPriority -Force
          function Test-ChinaMirrorPriority { return $false }
          $global = @(Get-TorchWheelUrls $runtime 'torch.whl')
          if ($global.Count -ne 1 -or $global[0] -notmatch '^https://download\.pytorch\.org/') {
            throw "Overseas wheel route must be official-only: $($global -join ', ')"
          }

      - name: Validate overseas pip install path
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'assets/download_route_fix.ps1' -Raw
          foreach ($needle in @(
            'official PyTorch index',
            '--index-url $($Runtime.index_url)',
            '--timeout 1800',
            '--retries 10',
            'mainland mirror-optimized wheel cache'
          )) {
            if (-not $text.Contains($needle)) { throw "Missing regional routing safeguard: $needle" }
          }
          if ($text -notmatch 'if \(-not \(Test-ChinaMirrorPriority\)\)') {
            throw 'Overseas official-pip branch is missing.'
          }
