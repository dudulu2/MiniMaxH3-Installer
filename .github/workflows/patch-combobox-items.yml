name: Patch ComboBox item initialization

on:
  push:
    branches:
      - fix/combobox-items-initialization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combobox-items-initialization

      - name: Replace delayed DataSource binding with synchronous items
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          core = Path('assets/hardware_profiles_core.ps1')
          text = core.read_text(encoding='utf-8-sig')

          marker = '''function Get-ProfileSummaryText {'''
          helper = r'''function Initialize-ProfileComboBox {
              param($Combo, $Choices, [string]$SelectedId)
              if (-not $Combo) { throw "Profile ComboBox is missing." }

              $Combo.BeginUpdate()
              try {
                  $Combo.DataSource = $null
                  $Combo.Items.Clear()
                  $Combo.DisplayMember = "Label"
                  foreach ($choice in @($Choices)) {
                      if ($choice) { [void]$Combo.Items.Add($choice) }
                  }
                  if ($Combo.Items.Count -eq 0) {
                      throw "No installation profiles are available."
                  }

                  $selectedIndex = 0
                  for ($i = 0; $i -lt $Combo.Items.Count; $i++) {
                      $item = $Combo.Items[$i]
                      $idProperty = $item.PSObject.Properties["Id"]
                      if ($idProperty -and [string]$idProperty.Value -eq [string]$SelectedId) {
                          $selectedIndex = $i
                          break
                      }
                  }
                  $Combo.SelectedIndex = $selectedIndex
              } finally {
                  $Combo.EndUpdate()
              }
          }

          function Get-ProfileSummaryText {'''
          if 'function Initialize-ProfileComboBox' not in text:
              if marker not in text:
                  raise SystemExit('Profile summary insertion marker was not found.')
              text = text.replace(marker, helper, 1)

          old = r'''    $combo.DisplayMember = "Label"
              $combo.ValueMember = "Id"
              $combo.DataSource = $choices
              $selectedIndex = 0
              for ($i = 0; $i -lt $choices.Count; $i++) {
                  if ([string]$choices[$i].Id -eq [string]$script:SelectedProfileId) {
                      $selectedIndex = $i
                      break
                  }
              }
              $combo.SelectedIndex = $selectedIndex
              $dialog.Controls.Add($combo)'''
          new = r'''    $combo.DisplayMember = "Label"
              $dialog.Controls.Add($combo)
              Initialize-ProfileComboBox -Combo $combo -Choices $choices -SelectedId $script:SelectedProfileId'''
          if old not in text:
              raise SystemExit('Expected DataSource ComboBox block was not found.')
          text = text.replace(old, new, 1)
          core.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/validate-installer.yml')
          validation = workflow.read_text(encoding='utf-8-sig')
          marker = '''      - name: Validate profile catalog and downloader dry-runs'''
          step = r'''      - name: Validate real WinForms profile ComboBox initialization
              shell: powershell
              run: |
                Add-Type -AssemblyName System.Windows.Forms
                $script:AssetsRoot = (Resolve-Path 'assets').Path
                . (Join-Path $script:AssetsRoot 'hardware_profiles_core.ps1')

                $choices = New-Object System.Collections.ArrayList
                [void]$choices.Add([PSCustomObject]@{ Id='auto'; Label='Auto' })
                [void]$choices.Add([PSCustomObject]@{ Id='compatibility'; Label='Compatibility' })
                [void]$choices.Add([PSCustomObject]@{ Id='balanced_4090_32gb'; Label='Balanced' })

                $combo = New-Object Windows.Forms.ComboBox
                Initialize-ProfileComboBox -Combo $combo -Choices $choices -SelectedId 'balanced_4090_32gb'
                if ($combo.Items.Count -ne 3) { throw "Expected 3 synchronous ComboBox items, got $($combo.Items.Count)." }
                if ($combo.SelectedIndex -ne 2) { throw "Expected selected index 2, got $($combo.SelectedIndex)." }
                if ((Get-ProfileChoiceId $combo) -ne 'balanced_4090_32gb') { throw 'Selected profile ID was not preserved.' }

                $fallback = New-Object Windows.Forms.ComboBox
                Initialize-ProfileComboBox -Combo $fallback -Choices $choices -SelectedId 'unknown-profile'
                if ($fallback.SelectedIndex -ne 0) { throw "Unknown profile must fall back to index 0, got $($fallback.SelectedIndex)." }
                if ((Get-ProfileChoiceId $fallback) -ne 'auto') { throw 'Unknown profile did not fall back to auto.' }

                $empty = New-Object Windows.Forms.ComboBox
                $threw = $false
                try { Initialize-ProfileComboBox -Combo $empty -Choices @() -SelectedId 'auto' } catch { $threw = $true }
                if (-not $threw) { throw 'An empty profile list must fail with a controlled exception.' }

          '''
          if 'Validate real WinForms profile ComboBox initialization' not in validation:
              if marker not in validation:
                  raise SystemExit('CI insertion marker was not found.')
              validation = validation.replace(marker, step + marker, 1)
              workflow.write_text(validation, encoding='utf-8')
          '@ | python -

      - name: Parse and exercise the real WinForms ComboBox
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/hardware_profiles_core.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          Add-Type -AssemblyName System.Windows.Forms
          $script:AssetsRoot = (Resolve-Path 'assets').Path
          . (Join-Path $script:AssetsRoot 'hardware_profiles_core.ps1')
          $choices = New-Object System.Collections.ArrayList
          [void]$choices.Add([PSCustomObject]@{ Id='auto'; Label='Auto' })
          [void]$choices.Add([PSCustomObject]@{ Id='compatibility'; Label='Compatibility' })
          $combo = New-Object Windows.Forms.ComboBox
          Initialize-ProfileComboBox -Combo $combo -Choices $choices -SelectedId 'compatibility'
          if ($combo.Items.Count -ne 2 -or $combo.SelectedIndex -ne 1) { throw 'Real ComboBox initialization failed.' }

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_core.ps1 .github/workflows/validate-installer.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Initialize profile ComboBox items synchronously"
          git push origin HEAD:fix/combobox-items-initialization
