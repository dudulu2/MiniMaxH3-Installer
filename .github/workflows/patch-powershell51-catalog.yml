name: Patch PowerShell 5.1 model catalog

on:
  push:
    branches:
      - fix/powershell51-catalog-array
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/powershell51-catalog-array

      - name: Normalize ConvertFrom-Json arrays and add regression coverage
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          core = Path('assets/hardware_profiles_core.ps1')
          text = core.read_text(encoding='utf-8-sig')

          old_header = '$script:ModelCatalog = @(Get-Content -LiteralPath $script:CatalogPath -Raw | ConvertFrom-Json)'
          new_header = '''$catalogPayload = Get-Content -LiteralPath $script:CatalogPath -Raw | ConvertFrom-Json
          # Windows PowerShell 5.1 can emit a top-level JSON array as one Object[] pipeline object.
          # Pipe the payload once more to force element-by-element enumeration.
          $script:ModelCatalog = @($catalogPayload | ForEach-Object { $_ })
          if ($script:ModelCatalog.Count -eq 0) { throw "The MiniMax H3 model catalog is empty." }'''
          if old_header not in text:
              raise SystemExit('Model catalog initialization line was not found.')
          text = text.replace(old_header, new_header, 1)

          old_function = '''function Get-ProfileModelBytes {
              param($Profile)
              $paths = @($Profile.diffusion_model, $Profile.text_encoder, $Profile.video_vae, $Profile.audio_vae)
              $total = [int64]0
              foreach ($path in $paths) {
                  $item = $script:ModelCatalog | Where-Object { $_.path -eq $path } | Select-Object -First 1
                  if (-not $item) { throw "Profile $($Profile.id) references a model absent from the catalog: $path" }
                  $total += [int64]$item.size
              }
              return $total
          }'''
          new_function = '''function Get-ModelCatalogItem {
              param([string]$Path)
              $matches = @($script:ModelCatalog | Where-Object { [string]$_.path -eq $Path })
              if ($matches.Count -eq 0) { throw "Model is absent from the catalog: $Path" }
              if ($matches.Count -gt 1) { throw "Model appears more than once in the catalog: $Path" }

              $item = $matches[0]
              $size = [int64]0
              if (-not [int64]::TryParse([string]$item.size, [ref]$size) -or $size -le 0) {
                  throw "Model catalog contains an invalid size for $Path."
              }
              return [PSCustomObject]@{
                  Path = [string]$item.path
                  Size = $size
                  Sha256 = [string]$item.sha256
              }
          }

          function Get-ProfileModelBytes {
              param($Profile)
              $paths = @($Profile.diffusion_model, $Profile.text_encoder, $Profile.video_vae, $Profile.audio_vae)
              $total = [int64]0
              foreach ($path in $paths) {
                  $item = Get-ModelCatalogItem -Path ([string]$path)
                  $total += $item.Size
              }
              return $total
          }'''
          if old_function not in text:
              raise SystemExit('Get-ProfileModelBytes function was not found.')
          core.write_text(text.replace(old_function, new_function, 1), encoding='utf-8')

          workflow = Path('.github/workflows/validate-installer.yml')
          validation = workflow.read_text(encoding='utf-8-sig')
          marker = '      - name: Validate hardware recommendation and profile selection\n'
          step = '''      - name: Validate PowerShell 5.1 JSON catalog normalization
              shell: powershell
              run: |
                $script:AssetsRoot = (Resolve-Path 'assets').Path
                function Get-TotalRamBytes { return [int64](32GB) }
                function Get-NvidiaSmiPath { return $null }
                function Format-GiB { param([int64]$Bytes); return "{0:N1} GiB" -f ($Bytes / 1GB) }
                function Get-DriveFreeBytes { param([string]$Path); return [int64](200GB) }
                . (Join-Path $script:AssetsRoot 'hardware_profiles_core.ps1')

                if ($script:ModelCatalog.Count -lt 10) { throw "Catalog was not flattened; count is $($script:ModelCatalog.Count)." }
                foreach ($entry in $script:ModelCatalog) {
                  if ($entry -is [System.Array]) { throw 'Catalog contains a nested Object[] entry.' }
                  if ([string]::IsNullOrWhiteSpace([string]$entry.path)) { throw 'Catalog entry path is empty.' }
                }
                foreach ($profile in $script:Profiles) {
                  $bytes = Get-ProfileModelBytes $profile
                  if ($bytes -isnot [int64] -or $bytes -le 0) { throw "Invalid model byte total for $($profile.id): $bytes" }
                  $summary = Get-ProfileSummaryText $profile
                  if ($summary -notmatch '^Models ') { throw "Profile summary failed for $($profile.id)." }
                }

          '''
          if 'Validate PowerShell 5.1 JSON catalog normalization' not in validation:
              if marker not in validation:
                  raise SystemExit('Validation insertion marker was not found.')
              validation = validation.replace(marker, step + marker, 1)
              workflow.write_text(validation, encoding='utf-8')
          '@ | python -

      - name: Parse and exercise model catalog with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/hardware_profiles_core.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          $script:AssetsRoot = (Resolve-Path 'assets').Path
          . (Join-Path $script:AssetsRoot 'hardware_profiles_core.ps1')
          if ($script:ModelCatalog.Count -lt 10) { throw "Catalog normalization failed: $($script:ModelCatalog.Count) entries." }
          $profile = Get-ProfileById 'compatibility'
          $bytes = Get-ProfileModelBytes $profile
          if ($bytes -ne [int64]42470585471) { throw "Unexpected compatibility model total: $bytes" }
          [void](Get-ProfileSummaryText $profile)

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_core.ps1 .github/workflows/validate-installer.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Normalize model catalog arrays on Windows PowerShell 5.1"
          git push origin HEAD:fix/powershell51-catalog-array
