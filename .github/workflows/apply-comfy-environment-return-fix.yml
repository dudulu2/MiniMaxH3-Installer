name: Apply Comfy environment return fix

on:
  push:
    branches:
      - fix/comfy-environment-return
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comfy-environment-return

      - name: Apply patch
        run: python tools/apply_comfy_environment_return_fix.py

      - name: Validate PowerShell 5.1 contract
        shell: powershell
        run: |
          $path = Resolve-Path 'assets/hardware_profiles_install.ps1'
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          $helperAst = $ast.Find({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Resolve-ComfyEnvironmentResult'
          }, $true)
          if (-not $helperAst) { throw 'Resolve-ComfyEnvironmentResult was not added.' }
          Invoke-Expression $helperAst.Extent.Text

          $expected = [PSCustomObject]@{ ComfyRoot = 'C:\ComfyUI'; Python = 'C:\Python\python.exe' }
          $resolved = Resolve-ComfyEnvironmentResult -Output @(0, 'noise', $expected)
          if ($resolved.ComfyRoot -ne $expected.ComfyRoot -or $resolved.Python -ne $expected.Python) {
            throw 'The environment resolver did not select the environment object.'
          }

          $failed = $false
          try { Resolve-ComfyEnvironmentResult -Output @(0, 'noise') | Out-Null } catch { $failed = $true }
          if (-not $failed) { throw 'The environment resolver accepted output without an environment object.' }

          $installAst = $ast.Find({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Install-ComfyEnvironment'
          }, $true)
          $installText = $installAst.Extent.Text
          if ($installText -match '(?m)^\s+Invoke-(PipWithFallback|ProcessChecked)\s') {
            throw 'Install-ComfyEnvironment still contains an unsuppressed helper invocation.'
          }

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_install.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Comfy environment return-value pollution"
          git push origin HEAD:fix/comfy-environment-return
