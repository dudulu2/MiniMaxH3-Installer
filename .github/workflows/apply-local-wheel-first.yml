name: Apply local wheel first

on:
  push:
    branches: [plugin-minimaxh3-clean]
    paths:
      - '.github/workflows/apply-local-wheel-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch installer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('plugin-minimaxh3-clean/Install-Plugins.ps1')
          s = p.read_text(encoding='utf-8')
          if 'Found local $($Spec.Distribution) wheel beside installer' not in s:
              old = '''function Download-ValidatedWheel($Spec, [string]$WheelDir) {
    New-Item -ItemType Directory -Force -Path $WheelDir | Out-Null
    $dest = Join-Path $WheelDir $Spec.FileName
'''
              new = '''function Download-ValidatedWheel($Spec, [string]$WheelDir) {
    New-Item -ItemType Directory -Force -Path $WheelDir | Out-Null
    $dest = Join-Path $WheelDir $Spec.FileName

    # Browser/manual download support: put the exact validated wheel beside Install-Plugins.bat.
    $localWheel = Join-Path $PSScriptRoot $Spec.FileName
    if (Test-Path -LiteralPath $localWheel -PathType Leaf) {
        Write-Log "Found local $($Spec.Distribution) wheel beside installer: $localWheel"
        if (Test-ValidatedWheel $localWheel $Spec) {
            Write-Log "Local wheel passed size/SHA256 validation; network download skipped."
            return $localWheel
        }
        Write-Log "Local wheel exists but failed size/SHA256 validation; ignoring it and trying network sources." "WARN"
    }
'''
              if old not in s:
                  raise SystemExit('target block not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-minimaxh3-clean/Install-Plugins.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prefer validated local wheels beside installer'
          git push origin HEAD:plugin-minimaxh3-clean
