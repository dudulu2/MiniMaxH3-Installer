name: Build plugin source resource

on:
  push:
    branches: [plugin-minimaxh3-current]
    paths:
      - '.github/workflows/build-plugin-source-resource.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v4

      - name: Checkout validated legacy plugin source snapshot
        uses: actions/checkout@v4
        with:
          repository: dudulu2/MiniMax-H3-OneClick
          ref: 2f6e2b4ae45852d2f8355bfea338e1ab80676964
          path: _source

      - name: Checkout current-era official ComfyUI Manager
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI-Manager
          ref: fe1193c0c8168904e32d814190ba7f2ba2ad7581
          path: _manager

      - name: Build minimal plugin source resource
        shell: powershell
        run: |
          $src = Join-Path $PWD '_source\step2-plugin-pack'
          $stage = Join-Path $PWD '_plugin_resource\plugins'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Keep the previously validated plugin snapshots temporarily, but do
          # not reuse the stale OneClick ComfyUI-Manager. The target ComfyUI
          # commit is v0.30.1 from 2026-08-03, so Manager is pinned to the
          # official Comfy-Org commit from the same date.
          $legacyPlugins = @(
            'comfyui_essentials',
            'comfyui-crystools',
            'comfyui-custom-scripts',
            'comfyui-VideoHelperSuite',
            'rgthree-comfy',
            'comfyui-minimax-h3-audio-T8',
            'comfyui-minimax-h3-blockcache-T8',
            'ComfyUI-MiniMaxH3-AVCache-CN',
            'TE-Speed-MiniMaxH3-OSS',
            'SageAttention-MiniMaxH3-Safe'
          )
          foreach ($name in $legacyPlugins) {
            $from = Join-Path $src $name
            if (-not (Test-Path -LiteralPath $from -PathType Container)) { throw "Missing source plugin: $name" }
            Copy-Item -LiteralPath $from -Destination (Join-Path $stage $name) -Recurse -Force
          }

          $managerDest = Join-Path $stage 'comfyui-manager'
          New-Item -ItemType Directory -Force -Path $managerDest | Out-Null
          Get-ChildItem -LiteralPath (Join-Path $PWD '_manager') -Force |
            Where-Object { $_.Name -ne '.git' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $managerDest -Recurse -Force }

          $managerReq = Get-Content -LiteralPath (Join-Path $managerDest 'requirements.txt') -Raw
          if ($managerReq -match '(?im)^matrix-client') { throw 'Stale matrix-client dependency leaked into bundled ComfyUI-Manager.' }
          if ($managerReq -notmatch '(?im)^matrix-nio\s*$') { throw 'Pinned official ComfyUI-Manager must use matrix-nio.' }

          $resources = Join-Path $PWD 'plugin-minimaxh3\resources'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          $zip = Join-Path $resources 'plugins-source.zip'
          Compress-Archive -LiteralPath (Join-Path $PWD '_plugin_resource\plugins') -DestinationPath $zip -CompressionLevel Optimal -Force

          # Keep the manifest's expected resource size synchronized with the
          # generated archive so runtime validation remains deterministic.
          $manifestPath = Join-Path $PWD 'plugin-minimaxh3\plugin-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.source.size = [int64](Get-Item -LiteralPath $zip).Length
          if (-not ($manifest.source.PSObject.Properties.Name -contains 'manager_provenance')) {
            $manifest.source | Add-Member -NotePropertyName manager_provenance -NotePropertyValue ([pscustomobject]@{})
          }
          $manifest.source.manager_provenance = [pscustomobject]@{
            repository = 'Comfy-Org/ComfyUI-Manager'
            commit = 'fe1193c0c8168904e32d814190ba7f2ba2ad7581'
            aligned_with = 'ComfyUI v0.30.1 / 2026-08-03'
          }
          $manifest | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          Get-Item $zip | Format-List Name,Length,FullName

      - name: Upload plugin source resource
        uses: actions/upload-artifact@v4
        with:
          name: plugin-source-resource
          path: plugin-minimaxh3/resources/plugins-source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Commit resource to branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin-minimaxh3/resources/plugins-source.zip plugin-minimaxh3/plugin-manifest.json
          if (git diff --cached --quiet) {
            Write-Host 'Resource archive is already current.'
            exit 0
          }
          git commit -m "Bundle current-era official ComfyUI Manager"
          git push origin HEAD:plugin-minimaxh3-current
