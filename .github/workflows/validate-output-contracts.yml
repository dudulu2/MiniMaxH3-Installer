name: Validate PowerShell output contracts

on:
  push:
    branches:
      - main
      - fix/powershell-output-pollution
  pull_request:

permissions:
  contents: read

jobs:
  validate-output-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exercise helper return contracts on Windows PowerShell 5.1
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Net.Http
          $script:InstallerRoot = (Resolve-Path '.').Path

          function Add-Log { param([string]$Message, [string]$Level = 'INFO') }
          function Set-Stage { param([string]$Text, [int]$Percent = -1) }
          function Pump-UI {}

          function Import-FunctionFromFile {
            param([string]$Path, [string]$Name)
            $tokens = $null
            $errors = $null
            $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Could not parse $Path" }
            $functionAst = $ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $Name
            }, $true)
            if (-not $functionAst) { throw "Function $Name was not found in $Path" }
            Invoke-Expression $functionAst.Extent.Text
          }

          Import-FunctionFromFile 'Install-MiniMaxH3.ps1' 'Invoke-ProcessChecked'
          Import-FunctionFromFile 'Install-MiniMaxH3.ps1' 'New-HttpClient'
          Import-FunctionFromFile 'Install-MiniMaxH3.ps1' 'Invoke-SimpleDownload'
          Import-FunctionFromFile 'Install-MiniMaxH3.ps1' 'Install-PythonRuntime'

          $successOutput = @(Invoke-ProcessChecked $env:ComSpec '/c exit 0' $script:InstallerRoot)
          if ($successOutput.Count -ne 0) {
            throw "Successful Invoke-ProcessChecked leaked pipeline output: $($successOutput -join ', ')"
          }

          $failureOutput = @(Invoke-ProcessChecked $env:ComSpec '/c exit 7' $script:InstallerRoot -AllowFailure)
          if ($failureOutput.Count -ne 1 -or [int]$failureOutput[0] -ne 7) {
            throw "AllowFailure must return exactly one exit code; got: $($failureOutput -join ', ')"
          }

          $serverRoot = Join-Path $env:RUNNER_TEMP 'output-contract-server'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'output-contract-download'
          New-Item -ItemType Directory -Force -Path $serverRoot, $downloadRoot | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $serverRoot 'payload.bin'), [byte[]](1,2,3,4,5,6,7,8))
          $port = Get-Random -Minimum 20000 -Maximum 45000
          $server = Start-Process -FilePath python -ArgumentList '-m','http.server',"$port",'--bind','127.0.0.1','--directory',$serverRoot -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 2
            $destination = Join-Path $downloadRoot 'payload.bin'
            $downloadOutput = @(Invoke-SimpleDownload 'test payload' @("http://127.0.0.1:$port/payload.bin") $destination)
            if ($downloadOutput.Count -ne 0) {
              throw "Invoke-SimpleDownload leaked pipeline output: $($downloadOutput | Out-String)"
            }
            if (-not (Test-Path -LiteralPath $destination) -or (Get-Item $destination).Length -ne 8) {
              throw 'Invoke-SimpleDownload did not write the expected payload.'
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

          $existingRoot = Join-Path $env:RUNNER_TEMP 'existing-python-runtime'
          $pythonRoot = Join-Path $existingRoot 'runtime\python'
          New-Item -ItemType Directory -Force -Path $pythonRoot | Out-Null
          $source = @'
          using System;
          public static class Program {
              public static int Main(string[] args) {
                  Console.WriteLine("3.10");
                  return 0;
              }
          }
          '@
          Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly (Join-Path $pythonRoot 'python.exe') -OutputType ConsoleApplication
          $existingResult = @(Install-PythonRuntime $existingRoot)
          if ($existingResult.Count -ne 1 -or $existingResult[0] -isnot [string]) {
            throw "Existing Install-PythonRuntime must return one string; got $($existingResult.Count) values."
          }
          if ($existingResult[0] -ne (Join-Path $pythonRoot 'python.exe')) {
            throw "Unexpected existing Python path: $($existingResult[0])"
          }

          Remove-Item Function:\Invoke-SimpleDownload -Force
          Remove-Item Function:\Invoke-ProcessChecked -Force
          function Invoke-SimpleDownload {
            param([string]$Name, [string[]]$Urls, [string]$Destination)
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $Destination) | Out-Null
            Set-Content -LiteralPath $Destination -Value 'fake installer' -Encoding ASCII
          }
          function Get-AuthenticodeSignature {
            param([string]$LiteralPath)
            [PSCustomObject]@{
              Status = [Management.Automation.SignatureStatus]::Valid
              SignerCertificate = [PSCustomObject]@{ Subject = 'CN=Python Software Foundation' }
            }
          }
          function Invoke-ProcessChecked {
            param([string]$FilePath, [string]$Arguments, [string]$WorkingDirectory, [switch]$AllowFailure)
            $target = Join-Path $WorkingDirectory 'runtime\python'
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -LiteralPath (Join-Path $pythonRoot 'python.exe') -Destination (Join-Path $target 'python.exe') -Force
            if ($AllowFailure) { return 0 }
          }

          $freshRoot = Join-Path $env:RUNNER_TEMP 'fresh-python-runtime'
          $freshResult = @(Install-PythonRuntime $freshRoot)
          if ($freshResult.Count -ne 1 -or $freshResult[0] -isnot [string]) {
            throw "Fresh Install-PythonRuntime must return one string; got $($freshResult.Count) values: $($freshResult | Out-String)"
          }
          if ($freshResult[0] -ne (Join-Path $freshRoot 'runtime\python\python.exe')) {
            throw "Unexpected fresh Python path: $($freshResult[0])"
          }

      - name: Verify no unsuppressed HTTP response objects remain
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'Install-MiniMaxH3.ps1' -Raw
          $unsafe = [regex]::Matches($text, '(?m)^\s*\$response\.EnsureSuccessStatusCode\(\)\s*$')
          if ($unsafe.Count -gt 0) {
            throw "Found $($unsafe.Count) unsuppressed EnsureSuccessStatusCode call(s)."
          }
