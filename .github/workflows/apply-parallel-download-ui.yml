name: Apply parallel download UI patch

on:
  push:
    branches:
      - feature/parallel-model-downloads
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parallel-model-downloads

      - name: Apply PowerShell UI patch
        run: python tools/apply_parallel_download_ui.py

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          foreach ($path in @('assets/hardware_profiles_core.ps1', 'assets/hardware_profiles_install.ps1', 'Install-MiniMaxH3.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate download mode wiring
        shell: powershell
        run: |
          $core = Get-Content assets/hardware_profiles_core.ps1 -Raw
          $install = Get-Content assets/hardware_profiles_install.ps1 -Raw
          if ($core -notmatch 'function Get-ModelDownloadMode') { throw 'Download mode resolver missing.' }
          if ($core -notmatch 'Accelerated \(4 connections\)') { throw 'Download mode UI missing.' }
          if ($install -notmatch '--download-mode \$downloadMode') { throw 'Downloader mode argument missing.' }
          if ($install -notmatch 'Format-DownloadSpeed') { throw 'Live speed display missing.' }
          if ($install -notmatch 'model_download_mode') { throw 'Manifest mode missing.' }

      - name: Validate Python syntax and dry-run
        run: |
          python -m pip install requests
          python -m py_compile assets/download_models.py
          python assets/download_models.py --comfy-root test-output --status test-status.json --catalog assets/hf_model_inventory.json --profiles assets/install_profiles.json --profile compatibility --source-order mirror-first --download-mode auto --dry-run

      - name: Commit patched PowerShell files
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_core.ps1 assets/hardware_profiles_install.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add model download mode controls and live speed status"
          git push origin HEAD:feature/parallel-model-downloads
