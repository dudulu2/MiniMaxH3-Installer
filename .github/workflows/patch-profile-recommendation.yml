name: Patch generation-aware recommendations

on:
  push:
    branches:
      - feat/hardware-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hardware-profiles

      - name: Patch recommendation rules and tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          core = Path('assets/hardware_profiles_core.ps1')
          text = core.read_text(encoding='utf-8-sig')
          old = '''function Get-RecommendProfileId {
              param([double]$VramMiB, [int64]$RamBytes)
              if ($VramMiB -ge 22000 -and $RamBytes -ge [int64](60GB)) { return "quality_64gb" }
              if ($VramMiB -ge 22000 -and $RamBytes -ge [int64](30GB)) { return "balanced_4090_32gb" }
              return "compatibility"
          }'''
          new = '''function Get-RecommendProfileId {
              param([double]$VramMiB, [int64]$RamBytes, [string]$GpuName)
              if ($VramMiB -ge 22000 -and $RamBytes -ge [int64](60GB)) { return "quality_64gb" }
              $fp8Preferred = ($GpuName -match '(?i)RTX\\s*40\\d{2}') -or (Test-IsBlackwellGpu $GpuName)
              if ($fp8Preferred -and $VramMiB -ge 22000 -and $RamBytes -ge [int64](30GB)) { return "balanced_4090_32gb" }
              return "compatibility"
          }'''
          if old not in text:
              raise SystemExit('Recommendation function was not found.')
          text = text.replace(old, new, 1)
          old_call = '''RecommendedProfileId = (Get-RecommendProfileId -VramMiB $vramMiB -RamBytes $ramBytes)'''
          new_call = '''RecommendedProfileId = (Get-RecommendProfileId -VramMiB $vramMiB -RamBytes $ramBytes -GpuName $gpuName)'''
          if old_call not in text:
              raise SystemExit('Recommendation call was not found.')
          core.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')

          workflow = Path('.github/workflows/validate-installer.yml')
          validation = workflow.read_text(encoding='utf-8-sig')
          marker = '''      - name: Validate profile catalog and downloader dry-runs'''
          step = '''      - name: Validate hardware recommendation matrix
              shell: powershell
              run: |
                $script:AssetsRoot = (Resolve-Path 'assets').Path
                function Get-TotalRamBytes { return [int64](32GB) }
                function Get-NvidiaSmiPath { return $null }
                function Format-GiB { param([int64]$Bytes); return "{0:N1} GiB" -f ($Bytes / 1GB) }
                function Get-DriveFreeBytes { param([string]$Path); return [int64](200GB) }
                . (Join-Path $script:AssetsRoot 'hardware_profiles_core.ps1')
                $cases = @(
                  @('NVIDIA GeForce RTX 3060', 12288, [int64](32GB), 'compatibility', 'cuda126'),
                  @('NVIDIA GeForce RTX 3090', 24576, [int64](32GB), 'compatibility', 'cuda126'),
                  @('NVIDIA GeForce RTX 4090', 24576, [int64](32GB), 'balanced_4090_32gb', 'cuda126'),
                  @('NVIDIA GeForce RTX 5090', 32768, [int64](32GB), 'balanced_4090_32gb', 'cuda128'),
                  @('NVIDIA GeForce RTX 4090', 24576, [int64](64GB), 'quality_64gb', 'cuda126')
                )
                foreach ($case in $cases) {
                  $profile = Get-RecommendProfileId -GpuName $case[0] -VramMiB $case[1] -RamBytes $case[2]
                  $runtime = Get-RuntimeIdForGpu -GpuName $case[0]
                  if ($profile -ne $case[3]) { throw "Profile recommendation mismatch for $($case[0]): $profile" }
                  if ($runtime -ne $case[4]) { throw "Runtime recommendation mismatch for $($case[0]): $runtime" }
                }

          '''
          if 'Validate hardware recommendation matrix' not in validation:
              if marker not in validation:
                  raise SystemExit('CI insertion marker was not found.')
              validation = validation.replace(marker, step + marker, 1)
              workflow.write_text(validation, encoding='utf-8')
          '@ | python -

      - name: Parse PowerShell files
        shell: powershell
        run: |
          foreach ($path in @('assets/hardware_profiles_core.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hardware_profiles_core.ps1 .github/workflows/validate-installer.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Make profile recommendations GPU-generation aware"
          git push origin HEAD:feat/hardware-profiles
