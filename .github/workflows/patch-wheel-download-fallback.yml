name: Patch wheel download fallback

on:
  push:
    branches: [plugin-minimaxh3-clean]
    paths:
      - '.github/workflows/patch-wheel-download-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch wheel download fallback
        shell: powershell
        run: |
          $path = 'plugin-minimaxh3-clean\Install-Plugins.ps1'
          $text = Get-Content -LiteralPath $path -Raw

          $new = @'
          function Download-ValidatedWheel($Spec, [string]$WheelDir) {
              New-Item -ItemType Directory -Force -Path $WheelDir | Out-Null
              $dest = Join-Path $WheelDir $Spec.FileName

              foreach ($url in $Spec.Urls) {
                  try {
                      Write-Log "Downloading validated $($Spec.Distribution) wheel: $url"
                      Invoke-DownloadOne $url $dest $WheelDir
                      if (-not (Test-ValidatedWheel $dest $Spec)) { throw "size/SHA256 verification failed" }
                      return $dest
                  } catch {
                      Write-Log "Wheel source failed: $($_.Exception.Message)" "WARN"
                      Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
                  }
              }

              $package = "$($Spec.Distribution)==$($Spec.Version)"
              $indexes = @(
                  "https://pypi.tuna.tsinghua.edu.cn/simple",
                  "https://pypi.org/simple"
              )
              foreach ($index in $indexes) {
                  try {
                      Write-Log "Direct wheel URLs failed; trying pip download for $package from $index" "WARN"
                      Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
                      $args = @(
                          "-m", "pip", "download",
                          "--disable-pip-version-check",
                          "--no-deps",
                          "--only-binary=:all:",
                          "--dest", $WheelDir,
                          "-i", $index,
                          $package
                      )
                      $code = Invoke-Native $script:PythonExe $args $WheelDir -AllowFailure
                      if ($code -ne 0) { throw "pip download failed with exit code $code" }
                      if (-not (Test-ValidatedWheel $dest $Spec)) { throw "downloaded wheel did not match validated size/SHA256" }
                      return $dest
                  } catch {
                      Write-Log "Pip wheel source failed: $($_.Exception.Message)" "WARN"
                      Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
                  }
              }

              throw "Could not download validated wheel: $($Spec.FileName)"
          }
          '@
          $new = ($new -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          $pattern = '(?s)function Download-ValidatedWheel\(\$Spec, \[string\]\$WheelDir\) \{.*?(?=\r?\nfunction Install-ExactWheel)'
          if (-not [regex]::IsMatch($text, $pattern)) { throw 'Download-ValidatedWheel block not found.' }
          $text = [regex]::Replace($text, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $new.TrimEnd() }, 1)

          $oldPython = '$python = Join-Path $root "runtime\venv\Scripts\python.exe"'
          $newPython = @'
          $python = Join-Path $root "runtime\venv\Scripts\python.exe"
          $script:PythonExe = $python
          '@
          $newPython = ($newPython -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          if (-not $text.Contains($oldPython)) { throw 'Python assignment not found.' }
          $text = $text.Replace($oldPython, $newPython.TrimEnd())

          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Verify fallback markers
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'plugin-minimaxh3-clean\Install-Plugins.ps1' -Raw
          foreach ($needle in @('pip", "download"','pypi.tuna.tsinghua.edu.cn/simple','$script:PythonExe = $python','Test-ValidatedWheel $dest $Spec')) {
            if (-not $text.Contains($needle)) { throw "Missing fallback marker: $needle" }
          }

      - name: Commit patched installer
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin-minimaxh3-clean/Install-Plugins.ps1
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Add PyPI fallback for validated wheel downloads"
          git push origin HEAD:plugin-minimaxh3-clean
