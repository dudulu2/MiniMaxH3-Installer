name: Apply Windows model progress lock fix

on:
  push:
    branches:
      - fix/windows-model-progress-lock
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-model-progress-lock

      - name: Apply progress lock fix
        run: python tools/apply_windows_progress_lock_fix.py

      - name: Install test dependency
        run: python -m pip install requests

      - name: Validate Python progress writer
        shell: powershell
        run: |
          @'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("download_models", "assets/download_models.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as root:
              status = Path(root) / "model-progress.json"
              original_replace = module.os.replace
              attempts = {"count": 0}

              def flaky_replace(source, destination):
                  attempts["count"] += 1
                  if attempts["count"] <= 3:
                      raise PermissionError(5, "simulated Windows sharing violation")
                  return original_replace(source, destination)

              module.os.replace = flaky_replace
              module.write_status(status, {"phase": "download", "file_bytes": 123})
              payload = json.loads(status.read_text(encoding="utf-8"))
              assert payload["file_bytes"] == 123
              assert attempts["count"] == 4

              def always_locked(source, destination):
                  raise PermissionError(5, "simulated permanent sharing violation")

              module.os.replace = always_locked
              module.write_status(status, {"phase": "verify", "file_bytes": 456})
              assert json.loads(status.read_text(encoding="utf-8"))["file_bytes"] == 123
          '@ | python -

      - name: Validate PowerShell shared reader
        shell: powershell
        run: |
          $path = Resolve-Path 'assets/hardware_profiles_install.ps1'
          $tokens = $null
          $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          $readerAst = $ast.Find({
            param($node)
            $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Read-SharedJsonFile'
          }, $true)
          if (-not $readerAst) { throw 'Read-SharedJsonFile was not added.' }
          if ($readerAst.Extent.Text -notmatch 'FileShare\]::Delete') {
            throw 'Shared progress reader does not allow atomic replacement.'
          }
          Invoke-Expression $readerAst.Extent.Text

          $status = Join-Path $env:RUNNER_TEMP 'model-progress-lock-test.json'
          '{"phase":"download","file_bytes":789}' | Set-Content -LiteralPath $status -Encoding UTF8
          $state = Read-SharedJsonFile -Path $status
          if ($state.phase -ne 'download' -or $state.file_bytes -ne 789) {
            throw 'Shared progress reader returned unexpected data.'
          }

          $scriptText = Get-Content -LiteralPath $path -Raw
          if ($scriptText -notmatch '\$state = Read-SharedJsonFile -Path \$statusPath') {
            throw 'Installer loop is not using the shared progress reader.'
          }

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download_models.py assets/hardware_profiles_install.ps1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Windows model progress file sharing"
          git push origin HEAD:fix/windows-model-progress-lock
