name: Fix clean installer null distribution probe

on:
  push:
    branches: [plugin-minimaxh3-clean]
    paths:
      - '.github/workflows/fix-clean-null-distribution.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch null-safe distribution probe
        shell: powershell
        run: |
          $path = 'plugin-minimaxh3-clean\Install-Plugins.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $old = '        $value = (Get-Content -LiteralPath $result -Raw).Trim()'
          $new = @'
                  $rawValue = Get-Content -LiteralPath $result -Raw -ErrorAction SilentlyContinue
                  if ($null -eq $rawValue) { return $null }
                  $value = ([string]$rawValue).Trim()
          '@
          $new = ($new -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          if (-not $text.Contains($old)) { throw 'Distribution Trim line not found.' }
          $text = $text.Replace($old, $new.TrimEnd())
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object Text.UTF8Encoding($false)))

          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Verify empty distribution result is handled
        shell: powershell
        run: |
          $text = Get-Content -LiteralPath 'plugin-minimaxh3-clean\Install-Plugins.ps1' -Raw
          if ($text -notmatch '\$null -eq \$rawValue') { throw 'Null guard missing.' }
          if ($text -match '\(Get-Content -LiteralPath \$result -Raw\)\.Trim\(\)') { throw 'Unsafe Trim still present.' }

      - name: Commit patched installer
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugin-minimaxh3-clean/Install-Plugins.ps1
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Handle missing distributions without null Trim failure"
          git push origin HEAD:plugin-minimaxh3-clean
