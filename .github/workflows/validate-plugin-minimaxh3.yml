name: Validate plugin-minimaxh3

on:
  pull_request:
  push:
    branches: [plugin-minimaxh3-current]

permissions:
  contents: read

jobs:
  validate-current-runtime-plugin-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell entry points
        shell: powershell
        run: |
          foreach ($path in @(
            'plugin-minimaxh3/Check-Runtime.ps1',
            'plugin-minimaxh3/Install-Plugins.ps1',
            'plugin-minimaxh3/Install-Acceleration.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Match plugin target to installer CUDA13 runtime
        shell: powershell
        run: |
          $installer = Get-Content 'assets/install_profiles.json' -Raw | ConvertFrom-Json
          $plugin = Get-Content 'plugin-minimaxh3/plugin-manifest.json' -Raw | ConvertFrom-Json
          $cuda130 = $installer.runtimes.cuda130

          if ([string]$plugin.target.python -ne '3.10.11') { throw 'plugin-minimaxh3 must target Python 3.10.11.' }
          if ([string]$plugin.target.python_tag -ne 'cp310') { throw 'plugin-minimaxh3 must target cp310.' }
          if ([string]$plugin.target.torch -ne [string]$cuda130.torch) { throw 'Torch target drifted from installer cuda130.' }
          if ([string]$plugin.target.torchvision -ne [string]$cuda130.torchvision) { throw 'torchvision target drifted from installer cuda130.' }
          if ([string]$plugin.target.torchaudio -ne [string]$cuda130.torchaudio) { throw 'torchaudio target drifted from installer cuda130.' }
          if ([string]$plugin.target.cuda_prefix -ne [string]$cuda130.cuda_version) { throw 'CUDA target drifted from installer cuda130.' }
          if ([string]$plugin.target.comfyui_commit -ne '0764232429b8cfb10b79b6f186c8cb23e0b22897') { throw 'Unexpected ComfyUI target commit.' }

      - name: Validate bundled source resource
        shell: powershell
        run: |
          $manifest = Get-Content 'plugin-minimaxh3/plugin-manifest.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.source.mode -ne 'bundled_resource') { throw 'Plugin source must be bundled.' }
          if ([string]$manifest.source.resource -ne 'resources/plugins-source.zip') { throw 'Unexpected bundled source path.' }
          $resource = 'plugin-minimaxh3/resources/plugins-source.zip'
          if (-not (Test-Path -LiteralPath $resource -PathType Leaf)) { throw 'Bundled plugins-source.zip is missing.' }
          $actual = (Get-Item -LiteralPath $resource).Length
          if ([int64]$actual -ne [int64]$manifest.source.size) { throw "Bundled source size mismatch: $actual != $($manifest.source.size)" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $resource))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('/','\') })
            foreach ($required in @(
              'comfyui_essentials',
              'comfyui-crystools',
              'comfyui-custom-scripts',
              'comfyui-manager',
              'comfyui-VideoHelperSuite',
              'rgthree-comfy',
              'comfyui-minimax-h3-audio-T8',
              'comfyui-minimax-h3-blockcache-T8',
              'ComfyUI-MiniMaxH3-AVCache-CN',
              'TE-Speed-MiniMaxH3-OSS',
              'SageAttention-MiniMaxH3-Safe'
            )) {
              if (-not ($names | Where-Object { $_ -like "plugins\$required\*" } | Select-Object -First 1)) {
                throw "Bundled source is missing plugin: $required"
              }
            }
          } finally { $zip.Dispose() }

      - name: Validate current-runtime-first policy
        shell: powershell
        run: |
          $manifest = Get-Content 'plugin-minimaxh3/plugin-manifest.json' -Raw | ConvertFrom-Json
          $managed = @($manifest.managed_plugins)
          foreach ($required in @(
            'comfyui_essentials',
            'comfyui-crystools',
            'comfyui-custom-scripts',
            'comfyui-manager',
            'comfyui-VideoHelperSuite',
            'rgthree-comfy',
            'comfyui-minimax-h3-audio-T8',
            'comfyui-minimax-h3-blockcache-T8',
            'ComfyUI-MiniMaxH3-AVCache-CN'
          )) {
            if ($required -notin $managed) { throw "Managed plugin missing: $required" }
          }
          if ('minimax_h3_workflow_autoload' -in $managed) { throw 'Step1 workflow autoload must remain owned by MiniMaxH3-Installer.' }

          if (-not $manifest.validated_acceleration.te_speed.enabled_by_default) { throw 'Validated TE-Speed must be enabled by default.' }
          if ([string]$manifest.validated_acceleration.te_speed.plugin -ne 'TE-Speed-MiniMaxH3-OSS') { throw 'Unexpected TE-Speed plugin.' }
          if (-not $manifest.validated_acceleration.sageattention.enabled_by_default) { throw 'Validated Sage must be enabled by default.' }
          if ([string]$manifest.validated_acceleration.sageattention.triton_windows.version -ne '3.6.0.post25') { throw 'Unexpected Triton version.' }
          if ([string]$manifest.validated_acceleration.sageattention.sageattention.version -ne '2.2.0+cu130torch2.10.0andhigher.post6') { throw 'Unexpected SageAttention version.' }

          foreach ($path in @('plugin-minimaxh3/Check-Runtime.ps1','plugin-minimaxh3/Install-Plugins.ps1','plugin-minimaxh3/Install-Acceleration.ps1')) {
            $text = Get-Content $path -Raw
            if ($text.Contains('2.12.0+cu130')) { throw "$path still contains the OneClick Torch 2.12 target." }
            if ($text.Contains('3.13.9')) { throw "$path still contains the OneClick Python 3.13 target." }
          }

          $installerText = Get-Content 'plugin-minimaxh3/Install-Plugins.ps1' -Raw
          foreach ($needle in @(
            'Get-BundledSourceArchive',
            'source.resource',
            'wheels\dependencies',
            '--no-index',
            '--find-links',
            'Assert-Runtime $root',
            'plugin-backups\plugin-minimaxh3-',
            'pip", "check"'
          )) {
            if (-not $installerText.Contains($needle)) { throw "Installer safety contract missing: $needle" }
          }
          foreach ($forbidden in @('Get-SourceArchive','source.archive_url','MiniMax-H3-OneClick-')) {
            if ($installerText.Contains($forbidden)) { throw "Base installer still has runtime source download coupling: $forbidden" }
          }

          $accelText = Get-Content 'plugin-minimaxh3/Install-Acceleration.ps1' -Raw
          foreach ($needle in @(
            'Get-BundledSourceArchive',
            'source.resource',
            'patch_model.py',
            '--preflight',
            'tespeed_workflow_patch.py',
            '--no-deps',
            '--no-index',
            'triton-windows',
            'sageattention',
            'SAGE_ACCEL_SMOKE_OK',
            'Assert-Runtime $root'
          )) {
            if (-not $accelText.Contains($needle)) { throw "Acceleration safety contract missing: $needle" }
          }
          foreach ($forbidden in @('Get-PinnedSourceArchive','source.archive_url','MiniMax-H3-OneClick-')) {
            if ($accelText.Contains($forbidden)) { throw "Acceleration installer still has runtime source download coupling: $forbidden" }
          }

          $bat = Get-Content 'plugin-minimaxh3/Install-Plugins.bat' -Raw
          if (-not $bat.Contains('Install-Acceleration.ps1')) { throw 'BAT must install validated acceleration after base plugins.' }
